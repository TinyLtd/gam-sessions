# Static analysis with Semgrep Community Edition (open source engine, LGPL-2.1).
# Report-only: findings show as PR annotations and in the job summary; the job does not fail on findings.
# On pull requests only findings introduced by the PR are reported. Full scans run on the default branch and weekly.
name: Static analysis

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write # only used on public repos, where code scanning upload is free
    env:
      SEMGREP_VERSION: "1.178.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Install Semgrep
        run: pipx install "semgrep==${SEMGREP_VERSION}"

      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(--config p/default --metrics off --json-output=semgrep.json --sarif-output=semgrep.sarif --quiet)
          if [ -n "$BASE_SHA" ]; then args+=(--baseline-commit "$BASE_SHA"); fi
          semgrep scan "${args[@]}" || echo "::warning::Semgrep exited with an error; see the log above."

      - name: Report findings
        if: always()
        run: |
          [ -f semgrep.json ] || { echo "No results file." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          n=$(jq '.results | length' semgrep.json)
          # Inline annotations on the changed files (GitHub shows up to 50 per job)
          jq -r '.results[:50][] |
            (if .extra.severity == "ERROR" then "error" elif .extra.severity == "WARNING" then "warning" else "notice" end) as $lvl |
            "::\($lvl) file=\(.path),line=\(.start.line),endLine=\(.end.line),title=\(.check_id | split(".") | last)::\(.extra.message | gsub("\n"; " ") | .[0:400])"' semgrep.json
          {
            echo "## Semgrep: $n finding(s)"
            if [ "$n" -gt 0 ]; then
              echo
              echo "| Severity | Location | Rule |"
              echo "|---|---|---|"
              jq -r '.results[] | "| \(.extra.severity) | `\(.path):\(.start.line)` | \(.check_id | split(".") | last) |"' semgrep.json
              echo
              echo "Full results are attached to this run as the \`semgrep-results\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-results
          path: |
            semgrep.json
            semgrep.sarif
          if-no-files-found: ignore
          retention-days: 90

      - name: Send to Security tab (public repos)
        if: always() && !github.event.repository.private && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep
